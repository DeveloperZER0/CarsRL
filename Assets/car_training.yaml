behaviors:
  CarDriver:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      num_epoch: 4
      epsilon: 0.2
      lambd: 0.95
      # Wysokie beta = dużo eksploracji — kluczowe żeby nie utknąć w "staniu"
      beta: 3.0e-2
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 3
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
    # Krótki time_horizon — epizody kończą się szybko
    time_horizon: 256
    max_steps: 10000000
    checkpoint_interval: 200000
    summary_freq: 10000
    keep_checkpoints: 10
    threaded: false